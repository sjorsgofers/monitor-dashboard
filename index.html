<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zusje Roermond Dashboard</title>
  <style>
    :root{
      --bg:#050403;
      --bg-deep:#000000;
      --panel:rgba(18,14,10,0.55);
      --panel-2:rgba(8,6,4,0.75);
      --gold:#c8a45b;
      --gold-bright:#f0d28a;
      --gold-deep:#7a5e2e;
      --white:#ffffff;
      --muted:#a9a39a;
      --red:#ff4d4f;
      --red-glow:rgba(255,77,79,.55);
      --green:#3ddc84;
      --green-glow:rgba(61,220,132,.55);
      --glass-border:rgba(200,164,91,.35);
      --glass-border-soft:rgba(200,164,91,.18);
    }

    *{ box-sizing:border-box; }

    /* Responsive scale: 1rem = 16 design-px at 1920x1080,
       schaalt mee met het kleinste kant zodat ALLES altijd in beeld blijft. */
    html{
      font-size: min(0.833333vw, 1.481481vh);
    }

    html, body {
      height:100%;
      margin:0;
      background:var(--bg-deep);
      overflow:hidden;
      color:#fff;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    /* ===== Animated background ===== */
    #dashboard-shell{
      position:fixed;
      inset:0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(200,164,91,.12), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(200,164,91,.08), transparent 50%),
        linear-gradient(180deg, #0a0805 0%, #000 100%);
      overflow:hidden;
    }

    #dashboard-shell::before,
    #dashboard-shell::after{
      content:"";
      position:absolute;
      width:56.25rem;
      height:56.25rem;
      border-radius:50%;
      filter:blur(7.5rem);
      opacity:.35;
      pointer-events:none;
      z-index:0;
    }

    #dashboard-shell::before{
      top:-12.5rem;
      left:-12.5rem;
      background:radial-gradient(circle, rgba(200,164,91,.55), transparent 60%);
    }

    #dashboard-shell::after{
      bottom:-18.75rem;
      right:-12.5rem;
      background:radial-gradient(circle, rgba(200,164,91,.40), transparent 60%);
    }

    /* Subtle grain overlay */
    #dashboard-shell .grain{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:1;
      opacity:.06;
      mix-blend-mode:overlay;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px);
    }

    .zd-stage{
      position:relative;
      width:100%;
      height:100%;
      z-index:2;
    }

    /* Frame vult nu het hele scherm — geen fixed canvas + transform meer */
    .zd-frame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }

    .zd-wrap{
      width:100%;
      height:100%;
      padding:1.375rem 1.875rem 1.5rem;
      display:flex;
      flex-direction:column;
      gap:1.25rem;
    }

    /* ===== Top banner ===== */
    .zd-top{
      position:relative;
      min-height:10.625rem;
      padding:1.125rem 2.25rem;
      border-radius:1.5rem;
      overflow:hidden;
      background:
        linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,.42)),
        url("banner.jpg") center center / cover no-repeat;
      box-shadow:
        0 1.125rem 3.125rem rgba(0,0,0,.55),
        0 0 3.75rem rgba(200,164,91,.10);
    }

    .zd-top::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:1.5rem;
      padding:0.125rem;
      background:linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 35%, var(--gold-deep) 65%, var(--gold) 100%);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
              mask-composite:exclude;
      pointer-events:none;
    }

    .zd-top::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.05) 28%, rgba(0,0,0,.05) 72%, rgba(0,0,0,.55) 100%);
      pointer-events:none;
    }

    .zd-top-left,
    .zd-clock-center,
    .zd-date-right{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      z-index:2;
      display:flex;
      align-items:center;
    }

    .zd-top-left{ left:2.25rem; max-width:36%; }

    .zd-clock-center{
      left:50%;
      transform:translate(-50%, -50%);
      justify-content:center;
      text-align:center;
      width:max-content;
      flex-direction:column;
      gap:0.25rem;
    }

    .zd-date-right{
      right:2.25rem;
      justify-content:flex-end;
      text-align:right;
      flex-direction:column;
      align-items:flex-end;
      gap:0.25rem;
    }

    .zd-logo{
      display:block;
      height:8.75rem;
      width:auto;
      max-width:32.5rem;
      object-fit:contain;
      filter: drop-shadow(0 0.25rem 1.375rem rgba(0,0,0,.55)) drop-shadow(0 0 1.125rem rgba(200,164,91,.20));
    }

    .zd-clock{
      font-size:6.75rem;
      line-height:.88;
      font-weight:900;
      letter-spacing:-0.06em;
      font-variant-numeric:tabular-nums;
      color:#fff;
      text-shadow:0 0.25rem 1.375rem rgba(0,0,0,.6), 0 0 1.875rem rgba(200,164,91,.18);
      white-space:nowrap;
    }

    .zd-clock .colon{
      display:inline-block;
      color:var(--gold-bright);
    }

    .zd-clock-label,
    .zd-date-label{
      font-size:0.875rem;
      font-weight:700;
      letter-spacing:.32em;
      text-transform:uppercase;
      color:var(--gold-bright);
      opacity:.85;
    }

    .zd-date-value{
      font-size:6.75rem;
      line-height:.88;
      font-weight:900;
      letter-spacing:-0.04em;
      font-variant-numeric:tabular-nums;
      background:linear-gradient(180deg, #fff3d6 0%, var(--gold-bright) 45%, var(--gold) 100%);
      -webkit-background-clip:text;
              background-clip:text;
      -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0.25rem 1.375rem rgba(0,0,0,.55));
      white-space:nowrap;
    }

    /* ===== Main grid ===== */
    .zd-main{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: minmax(18rem, 26.25rem) 1fr minmax(18rem, 26.25rem);
      gap:1.375rem;
    }

    .zd-col{
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:1.375rem;
    }

    /* ===== Cards ===== */
    .zd-card{
      position:relative;
      min-height:0;
      display:flex;
      flex-direction:column;
      border-radius:1.75rem;
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow:
        0 1.25rem 3.125rem rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
      overflow:hidden;
    }

    .zd-card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:1.75rem;
      padding:0.125rem;
      background:linear-gradient(160deg, var(--gold-bright) 0%, var(--gold) 30%, rgba(200,164,91,.20) 60%, var(--gold) 100%);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
              mask-composite:exclude;
      pointer-events:none;
      opacity:.85;
    }

    .zd-card::after{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:1.75rem;
      box-shadow:0 0 3.75rem rgba(200,164,91,.06);
      pointer-events:none;
    }

    .zd-side{ padding:1.5rem 1.25rem 1.25rem; }
    .zd-center{ padding:1.375rem; }

    /* ===== 4 categorie-vakken (2×2) in de middenkolom ===== */
    .zd-catgrid{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr;
      gap:1.375rem;
    }
    .zd-catcard{ padding:1.25rem 1.25rem 1.125rem; }
    .zd-catcard .zd-card-title{
      font-size:1.5rem;
      margin-bottom:0.875rem;
      letter-spacing:.03em;
    }
    .zd-catcard .zd-card-icon{ width:1.875rem; height:1.875rem; }
    .zd-catcard .zd-card-icon svg{ width:1rem; height:1rem; }

    .zd-tasks{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:0.625rem;
      overflow:hidden;
    }
    .zd-t{
      display:flex;
      align-items:center;
      gap:0.875rem;
      min-height:3.125rem;
      padding:0.5rem 1rem;
      border-radius:0.875rem;
      background:linear-gradient(120deg, rgba(200,164,91,.18) 0%, rgba(200,164,91,.05) 100%);
      border:1px solid rgba(200,164,91,.28);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }
    .zd-t-dot{
      width:0.625rem;
      height:0.625rem;
      border-radius:50%;
      background:var(--gold-bright);
      box-shadow:0 0 0.625rem rgba(200,164,91,.85);
      flex:0 0 auto;
    }
    .zd-t-text{
      font-size:1.3rem;
      font-weight:700;
      line-height:1.22;
      color:#fff;
      min-width:0;
    }
    .zd-t-time{
      margin-left:auto;
      flex:0 0 auto;
      font-size:1.05rem;
      font-weight:800;
      color:var(--gold-bright);
      background:rgba(200,164,91,.14);
      border:1px solid rgba(200,164,91,.4);
      padding:0.2rem 0.75rem;
      border-radius:999px;
      white-space:nowrap;
      letter-spacing:.02em;
    }
    .zd-t-time.soon{ color:#ffb84d; border-color:rgba(255,184,77,.55); background:rgba(255,184,77,.12); }
    .zd-t-time.late{ color:#ff6b6b; border-color:rgba(255,107,107,.55); background:rgba(255,107,107,.12); }
    .zd-cat-empty{
      font-size:1.125rem;
      font-weight:600;
      color:rgba(255,255,255,.32);
      padding:0.25rem 0.125rem;
    }

    .zd-card-title{
      position:relative;
      font-size:1.875rem;
      font-weight:900;
      color:var(--gold-bright);
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:1.125rem;
      display:flex;
      align-items:center;
      gap:0.875rem;
    }

    .zd-card-title::after{
      content:"";
      flex:1;
      height:0.125rem;
      background:linear-gradient(90deg, var(--gold) 0%, transparent 100%);
      border-radius:0.125rem;
      opacity:.6;
    }

    .zd-card-icon{
      width:2.125rem;
      height:2.125rem;
      border-radius:0.625rem;
      background:linear-gradient(135deg, rgba(200,164,91,.25), rgba(200,164,91,.05));
      border:1px solid rgba(200,164,91,.4);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      color:var(--gold-bright);
    }

    .zd-card-icon svg{ width:1.125rem; height:1.125rem; }

    /* ===== Lists ===== */
    .zd-list{
      display:flex;
      flex-direction:column;
      gap:0.75rem;
      min-height:0;
      overflow:auto;
      padding-right:0.25rem;
    }

    .zd-list::-webkit-scrollbar,
    .zd-actions::-webkit-scrollbar{ width:0.5rem; }
    .zd-list::-webkit-scrollbar-thumb,
    .zd-actions::-webkit-scrollbar-thumb{
      background:linear-gradient(180deg, var(--gold), var(--gold-deep));
      border-radius:999px;
    }

    /* ===== Check items ===== */
    .zd-check-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:1rem;
      min-height:4.875rem;
      padding:0.875rem 1.125rem;
      border-radius:1.125rem;
      background:linear-gradient(135deg, rgba(255,255,255,.025), rgba(255,255,255,0));
      border:1px solid var(--glass-border-soft);
      overflow:hidden;
    }

    .zd-check-item::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width:0.25rem;
      background:rgba(200,164,91,.25);
    }

    .zd-check-item.is-ok::before{ background:linear-gradient(180deg, var(--green), #1faa5b); box-shadow:0 0 1rem var(--green-glow); }
    .zd-check-item.is-bad::before{ background:linear-gradient(180deg, var(--red), #c0282a); box-shadow:0 0 1rem var(--red-glow); }

    .zd-check-left{
      display:flex;
      align-items:center;
      gap:1rem;
      min-width:0;
      flex:1;
    }

    .zd-status-icon{
      width:2.625rem;
      height:2.625rem;
      border-radius:50%;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .zd-status-icon svg{ width:1.375rem; height:1.375rem; }

    .is-ok .zd-status-icon{
      background:radial-gradient(circle at 30% 30%, rgba(61,220,132,.35), rgba(61,220,132,.05) 70%);
      border:0.125rem solid var(--green);
      color:var(--green);
      box-shadow:0 0 1.5rem rgba(61,220,132,.45), inset 0 0 0.75rem rgba(61,220,132,.25);
    }

    .is-bad .zd-status-icon{
      background:radial-gradient(circle at 30% 30%, rgba(255,77,79,.35), rgba(255,77,79,.05) 70%);
      border:0.125rem solid var(--red);
      color:var(--red);
      box-shadow:0 0 1.5rem rgba(255,77,79,.45), inset 0 0 0.75rem rgba(255,77,79,.25);
    }

    .zd-name{
      font-size:1.875rem;
      line-height:1.08;
      font-weight:900;
      letter-spacing:.005em;
    }
    .zd-name.ok { color:var(--green); text-shadow:0 0 1.125rem rgba(61,220,132,.18); }
    .zd-name.bad{ color:var(--red);   text-shadow:0 0 1.125rem rgba(255,77,79,.18); }

    /* ===== Actions (flashy) ===== */
    .zd-actions{
      display:flex;
      flex-direction:column;
      gap:0.875rem;
      min-height:0;
      overflow:auto;
      padding:0.125rem;
    }

    /* Statische gouden aura rond de middencards */
    .zd-center-flex{
      flex:0 1 auto;
      box-shadow:
        0 1.25rem 3.125rem rgba(0,0,0,.55),
        0 0 3.25rem rgba(200,164,91,.32),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    /* Prominentere titels voor de flitsende kaarten */
    .zd-center-flex > .zd-card-title{
      font-size:2rem;
      color:#fff3d6;
      text-shadow:0 0 1.25rem rgba(200,164,91,.45);
    }
    .zd-center-flex > .zd-card-title .zd-card-icon{
      width:2.5rem;
      height:2.5rem;
      background:linear-gradient(135deg, rgba(200,164,91,.55), rgba(200,164,91,.12));
      border:1px solid rgba(200,164,91,.65);
      box-shadow:0 0 1.25rem rgba(200,164,91,.45), inset 0 0 0.5rem rgba(255,243,214,.2);
      color:#fff3d6;
    }
    .zd-center-flex > .zd-card-title .zd-card-icon svg{
      width:1.375rem;
      height:1.375rem;
    }

    .zd-cat{
      font-size:1.05rem;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--gold-bright);
      margin:1.1rem 0 .55rem;
      padding-bottom:.4rem;
      border-bottom:1px solid rgba(200,164,91,.28);
    }
    .zd-cat:first-child{ margin-top:.2rem; }
    .zd-action{
      position:relative;
      display:flex;
      align-items:center;
      gap:1.25rem;
      min-height:5.25rem;
      padding:1rem 1.5rem 1rem 1.75rem;
      border-radius:1.25rem;
      background:linear-gradient(120deg,
        rgba(200,164,91,.22) 0%,
        rgba(200,164,91,.08) 50%,
        rgba(200,164,91,.20) 100%);
      border:1px solid rgba(200,164,91,.55);
      overflow:hidden;
      box-shadow:
        0 0.5rem 1.5rem rgba(0,0,0,.35),
        0 0 1.5rem rgba(200,164,91,.12),
        inset 0 0 1rem rgba(200,164,91,.06);
    }

    /* Gouden accentstreep links */
    .zd-action::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width:0.4rem;
      background:linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-bright) 100%);
      box-shadow:0 0 1.5rem var(--gold), 0 0 0.5rem var(--gold-bright);
    }

    .zd-action.pending{
      background:linear-gradient(135deg, rgba(255,255,255,.025), rgba(255,255,255,0));
      border-color:rgba(140,140,140,.25);
      box-shadow:none;
    }
    .zd-action.pending::before{
      background:#5a5a5a;
      box-shadow:none;
    }

    /* Stralende gouden orb i.p.v. een puntje */
    .zd-action .zd-dot{
      position:relative;
      width:2.5rem;
      height:2.5rem;
      border-radius:50%;
      background:radial-gradient(circle at 32% 28%,
        #fff3d6 0%,
        var(--gold-bright) 28%,
        var(--gold) 60%,
        var(--gold-deep) 100%);
      flex:0 0 auto;
      box-shadow:
        0 0 1.75rem rgba(200,164,91,.85),
        0 0 3.25rem rgba(200,164,91,.45),
        inset 0 -0.25rem 0.5rem rgba(0,0,0,.22),
        inset 0 0.25rem 0.55rem rgba(255,243,214,.65);
    }
    .zd-action .zd-dot::after{
      content:"";
      position:absolute;
      top:14%; left:18%;
      width:32%; height:28%;
      background:radial-gradient(ellipse, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%);
      border-radius:50%;
      pointer-events:none;
    }

    .zd-action.pending .zd-dot{
      background:radial-gradient(circle at 32% 28%, #aaa 0%, #7a7a7a 60%, #4a4a4a 100%);
      box-shadow:none;
    }
    .zd-action.pending .zd-dot::after{ display:none; }

    .zd-action-text{
      position:relative;
      z-index:1;
      font-size:2.125rem;
      line-height:1.1;
      font-weight:900;
      color:#fff;
      letter-spacing:-0.01em;
      text-shadow:
        0 0.125rem 0.875rem rgba(0,0,0,.55),
        0 0 1.5rem rgba(255,243,214,.20);
    }

    .zd-action-text .late{
      color:var(--red);
      text-shadow:0 0 1.5rem rgba(255,77,79,.75);
    }

    .zd-action-text .soon{
      color:var(--gold-bright);
      text-shadow:0 0 1.25rem rgba(200,164,91,.55);
    }

    .zd-empty{
      font-size:1.75rem;
      font-weight:700;
      color:var(--muted);
      padding:0.875rem 0.375rem;
      text-align:center;
      letter-spacing:.02em;
    }

    /* ===== Footer ===== */
    .zd-footer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0.625rem;
      color:#7c7368;
      font-size:0.875rem;
      font-weight:700;
      letter-spacing:.32em;
      text-transform:uppercase;
    }
    .zd-footer .kbd{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:1.375rem;
      height:1.375rem;
      padding:0 0.4375rem;
      border-radius:0.375rem;
      border:1px solid rgba(200,164,91,.45);
      background:rgba(200,164,91,.08);
      color:var(--gold-bright);
      font-size:0.75rem;
      letter-spacing:0;
    }

  </style>
</head>
<body>
  <div id="dashboard-shell">
    <div class="grain"></div>
    <div class="zd-stage">
      <div class="zd-frame" id="zd-frame">
        <div class="zd-wrap">

          <div class="zd-top">
            <div class="zd-top-left">
              <img src="logo.png" alt="'t Zusje Roermond" class="zd-logo">
            </div>

            <div class="zd-clock-center">
              <div class="zd-clock-label">Tijd</div>
              <div class="zd-clock" id="zd-clock">--<span class="colon">:</span>--</div>
            </div>

            <div class="zd-date-right">
              <div class="zd-date-label">Datum</div>
              <div class="zd-date-value" id="zd-date">-- --</div>
            </div>
          </div>

          <div class="zd-main">
            <div class="zd-col">
              <section class="zd-card zd-side">
                <div class="zd-card-title">
                  <span class="zd-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
                  </span>
                  Checklists Bediening
                </div>
                <div class="zd-list" id="zd-serviceChecklists"></div>
              </section>
            </div>

            <div class="zd-col">
              <div class="zd-catgrid">
                <section class="zd-card zd-catcard">
                  <div class="zd-card-title">
                    <span class="zd-card-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
                    </span>
                    Containers &amp; Bidfood
                  </div>
                  <div class="zd-tasks" id="zd-cat-containers"></div>
                </section>

                <section class="zd-card zd-catcard">
                  <div class="zd-card-title">
                    <span class="zd-card-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/><path d="M2 3h3l2.6 12.5a1 1 0 001 .8h9.7a1 1 0 001-.8L21 8H6"/></svg>
                    </span>
                    Bestellen
                  </div>
                  <div class="zd-tasks" id="zd-cat-bestellen"></div>
                </section>

                <section class="zd-card zd-catcard">
                  <div class="zd-card-title">
                    <span class="zd-card-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v8a4 4 0 008 0V2M10 14v8M4 22h12"/></svg>
                    </span>
                    Keuken
                  </div>
                  <div class="zd-tasks" id="zd-cat-keuken"></div>
                </section>

                <section class="zd-card zd-catcard">
                  <div class="zd-card-title">
                    <span class="zd-card-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
                    </span>
                    Bediening
                  </div>
                  <div class="zd-tasks" id="zd-cat-bediening"></div>
                </section>
              </div>
            </div>

            <div class="zd-col">
              <section class="zd-card zd-side">
                <div class="zd-card-title">
                  <span class="zd-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v8a4 4 0 008 0V2M10 14v8M4 22h12"/></svg>
                  </span>
                  Checklists Keuken
                </div>
                <div class="zd-list" id="zd-kitchenChecklists"></div>
              </section>
            </div>
          </div>

          <div class="zd-footer">
            <span>Druk op</span>
            <span class="kbd">F</span>
            <span>voor fullscreen</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const CONFIG = {
      sheets:{
        checklistsJson:"https://script.google.com/macros/s/AKfycbw_Tn0z0s3AJ7CARzHt9sFy8CGhrCe_HzS9ao0KKDtgzq9TR_H-28WBss316I6PDcr7/exec",
        periodicJson:"https://script.google.com/macros/s/AKfycbxEDSHzBOrrYqkNOCQI6clM6DNuoge55tdATn1XNC63HT7GgPcsZF5AT3dwfaLjEUmV/exec",
        containersJson:"https://script.google.com/macros/s/AKfycbwPQ1WsRqrJmRuYD8bL6kz5H5sSDNcBsIa0z-WW4hain7fkVhM6HIUQI3DHyhpn-C1zHQ/exec"
      },
      refreshMs:15000
    };

    // Alle taken (containers, bestellingen, keuken, bediening) worden beheerd
    // in de Zusje-app onder "Taken & agenda" en komen uit Supabase.
    const state = {
      checklists: [],
      periodicTasks: []
    };

    const $ = (sel)=>document.querySelector(sel);
    const pad = (n)=>String(n).padStart(2,"0");

    const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
    const ICON_CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

    const getOpsDate = (d)=>{
      const x = new Date(d || Date.now());
      if(x.getHours() < 4) x.setDate(x.getDate() - 1);
      return x;
    };

    const fmtShortDate = (d)=>{
      return d.toLocaleDateString("nl-NL",{
        day:"2-digit",
        month:"2-digit"
      });
    };

    const weekNumber = d=>{
      const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dn = (t.getUTCDay()+6)%7;
      t.setUTCDate(t.getUTCDate()-dn+3);
      const fT = new Date(Date.UTC(t.getUTCFullYear(),0,4));
      return 1 + Math.round(((t-fT)/86400000 - 3 + ((fT.getUTCDay()+6)%7))/7);
    };

    const isEvenWeek = d => weekNumber(d)%2===0;

    const opsDateStrToday = ()=>{
      const d = getOpsDate(new Date());
      return d.toISOString().slice(0,10);
    };

    const ymdInAmsterdam = (dateLike)=>{
      const tz = "Europe/Amsterdam";
      if(!dateLike) return null;

      if(typeof dateLike === "string" && /^\d{4}-\d{2}-\d{2}/.test(dateLike)){
        return dateLike.slice(0,10);
      }

      const d = new Date(dateLike);
      if(isNaN(d)) return null;

      const parts = new Intl.DateTimeFormat("nl-NL",{
        timeZone: tz,
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }).formatToParts(d);

      let y,m,da;
      for(const p of parts){
        if(p.type==="year") y=p.value;
        else if(p.type==="month") m=p.value;
        else if(p.type==="day") da=p.value;
      }
      return (y && m && da) ? `${y}-${m}-${da}` : null;
    };

    const normalizeText = (str)=>String(str || "").toLowerCase().replace(/\s+/g," ").trim();

    function displayChecklistName(name){
      const original = String(name || "").trim();
      const n = normalizeText(name);

      if (n.includes("open")) return "Openen";
      if (n.includes("bediening onder")) return "Bediening onder";
      if (n.includes("bediening boven")) return "Bediening boven";
      if (n === "beneden" || n.includes("sluitlijst beneden")) return "Bediening onder";
      if (n === "boven" || n.includes("sluitlijst boven")) return "Bediening boven";
      if (n.includes("run")) return "Run";

      return original.replace(/^Keuken\s*[—-]\s*/i, "").trim();
    }

    function classifyChecklist(name){
      const n = normalizeText(name);

      if (
        n.includes("keuken") ||
        n.includes("spoel") ||
        n.includes("koude kant") ||
        n.includes("bakjeskant") ||
        n.includes("frituur") ||
        n.includes("warme kant") ||
        n.includes("uitgifte") ||
        n.includes("algemeen") ||
        n.includes("bar beneden") ||
        n.includes("bar boven") ||
        n.includes("sluitlijst keuken") ||
        n.includes("sluitlijst spoel")
      ) return "kitchen";

      return "service";
    }

    async function fetchChecklists(){
      try{
        const r = await fetch(CONFIG.sheets.checklistsJson,{cache:"no-store"});
        if(r.ok){
          const j = await r.json();
          if(Array.isArray(j.items)){
            state.checklists = j.items
              .map(it=>({name:String(it.name||"").trim(), done:!!it.done}))
              .filter(x=>x.name);
          }
        }
      }catch(e){
        console.warn("Checklist fetch fail",e);
      }
    }

    // Dagnotities & extra taken komen uit Supabase (beheerd in de Zusje-app,
    // tabblad "Taken & agenda"). Herhalende punten worden hier uitgevouwen naar vandaag.
    const AGENDA_SUPABASE_URL  = "https://xiwdbvxnjcrdwjhmpjnf.supabase.co";
    const AGENDA_SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpd2RidnhuamNyZHdqaG1wam5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2NjE1NzAsImV4cCI6MjA3MDIzNzU3MH0.d14QNY5Pof9j3zmlbs-5gBTs25s6xo_XYhyVbWE2P1k";

    function agendaOccursOnToday(it, t){
      const parts = (it.start_date||"").split("-").map(Number);
      if(parts.length < 3 || !parts[0]) return false;
      const start = new Date(parts[0], parts[1]-1, parts[2]);
      if(t < start) return false;
      if(it.until_date){ const u=it.until_date.split("-").map(Number); const ud=new Date(u[0],u[1]-1,u[2]); if(t>ud) return false; }
      switch(it.recurrence){
        case "daily": return true;
        case "weekly": { const wd=(it.weekdays&&it.weekdays.length)?it.weekdays:[start.getDay()]; return wd.includes(t.getDay()); }
        case "biweekly": {
          const wd=(it.weekdays&&it.weekdays.length)?it.weekdays:[start.getDay()];
          if(!wd.includes(t.getDay())) return false;
          const diffDays = Math.round((t - start) / 86400000);
          return Math.floor(diffDays / 7) % 2 === 0;
        }
        case "monthly": return t.getDate()===start.getDate();
        case "yearly": return t.getDate()===start.getDate() && t.getMonth()===start.getMonth();
        default: return t.getTime()===start.getTime();
      }
    }

    // Alles wordt nu beheerd in de Zusje-app (tabblad Taken & agenda) → alleen Supabase.
    const AGENDA_CATEGORIES = ["Containers & Bidfood", "Bestellen", "Keuken", "Bediening"];
    async function fetchPeriodic(){
      const todayStr = opsDateStrToday();
      const p = todayStr.split("-").map(Number);
      const t = new Date(p[0], p[1]-1, p[2]);
      try{
        const url = AGENDA_SUPABASE_URL + "/rest/v1/agenda_items?select=*";
        const r = await fetch(url, { headers:{ apikey:AGENDA_SUPABASE_ANON, Authorization:"Bearer "+AGENDA_SUPABASE_ANON }, cache:"no-store" });
        if(r.ok){
          const rows = await r.json();
          const todays = (Array.isArray(rows)?rows:[]).filter(it=>agendaOccursOnToday(it, t));
          state.periodicTasks = todays.map(it=>({
            title: it.title,
            category: it.category || "",
            all_day: !!it.all_day,
            start_time: it.start_time || ""
          }));
        }
      }catch(e){ console.warn("Periodic (Supabase) fail", e); }
    }

    async function loadAll(){
      await Promise.allSettled([
        fetchChecklists(),
        fetchPeriodic()
      ]);
      renderAll();
    }

    let _clockEls = null;
    function ensureClockEls(){
      if (_clockEls) return _clockEls;
      const root = $("#zd-clock");
      root.innerHTML = '<span class="hh">--</span><span class="colon">:</span><span class="mm">--</span><span class="colon">:</span><span class="ss">--</span>';
      _clockEls = {
        hh: root.querySelector('.hh'),
        mm: root.querySelector('.mm'),
        ss: root.querySelector('.ss')
      };
      return _clockEls;
    }

    function renderHeader(){
      const n = new Date();
      const ops = getOpsDate(n);
      const els = ensureClockEls();
      const hh = pad(n.getHours()), mm = pad(n.getMinutes()), ss = pad(n.getSeconds());
      // Alleen textContent updaten wanneer veranderd — geen DOM rebuild elke seconde
      if (els.hh.textContent !== hh) els.hh.textContent = hh;
      if (els.mm.textContent !== mm) els.mm.textContent = mm;
      if (els.ss.textContent !== ss) els.ss.textContent = ss;

      const dateStr = fmtShortDate(ops);
      const dateEl = $("#zd-date");
      if (dateEl.textContent !== dateStr) dateEl.textContent = dateStr;
    }

    function renderChecklistGroup(targetId, items){
      const wrap = document.getElementById(targetId);
      wrap.innerHTML = "";

      if(!items.length){
        wrap.innerHTML = `
          <div class="zd-check-item is-bad">
            <div class="zd-check-left">
              <span class="zd-status-icon">${ICON_CROSS}</span>
              <div class="zd-name bad">Geen checklists</div>
            </div>
          </div>
        `;
        return;
      }

      items.forEach(c=>{
        const done = !!c.done;
        const stateClass = done ? "is-ok" : "is-bad";
        const textClass = done ? "ok" : "bad";
        const icon = done ? ICON_CHECK : ICON_CROSS;

        const el = document.createElement("div");
        el.className = `zd-check-item ${stateClass}`;
        el.innerHTML = `
          <div class="zd-check-left">
            <span class="zd-status-icon">${icon}</span>
            <div class="zd-name ${textClass}">${displayChecklistName(c.name)}</div>
          </div>
        `;
        wrap.appendChild(el);
      });
    }

    let _lastServiceKey = null;
    let _lastKitchenKey = null;
    function renderChecklists(){
      const service = [];
      const kitchen = [];

      state.checklists.forEach(c=>{
        if(classifyChecklist(c.name) === "kitchen") kitchen.push(c);
        else service.push(c);
      });

      const serviceOrder = ["Openen","Bediening onder","Bediening boven","Run"];
      service.sort((a,b)=>{
        const ai = serviceOrder.indexOf(displayChecklistName(a.name));
        const bi = serviceOrder.indexOf(displayChecklistName(b.name));
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      // Alleen DOM herbouwen als de data veranderd is
      const sKey = JSON.stringify(service);
      if (sKey !== _lastServiceKey) {
        _lastServiceKey = sKey;
        renderChecklistGroup("zd-serviceChecklists", service);
      }
      const kKey = JSON.stringify(kitchen);
      if (kKey !== _lastKitchenKey) {
        _lastKitchenKey = kKey;
        renderChecklistGroup("zd-kitchenChecklists", kitchen);
      }
    }

    // ===== 4 categorie-vakken =====
    const CAT_TARGETS = {
      "Containers & Bidfood": "zd-cat-containers",
      "Bestellen": "zd-cat-bestellen",
      "Keuken": "zd-cat-keuken",
      "Bediening": "zd-cat-bediening"
    };

    function taskTimeBadge(x, now){
      // Taak met tijd = deadline: toon "vóór HH:MM", oranje bij <60 min, rood bij te laat.
      if(x.all_day || !x.start_time) return "";
      const m = /^(\d{1,2}):(\d{2})$/.exec(x.start_time.trim());
      if(!m) return "";
      const limit = new Date(now);
      limit.setHours(Number(m[1]), Number(m[2]), 0, 0);
      const diffMin = Math.round((limit - now) / 60000);
      let cls = "", label = "vóór " + x.start_time;
      if(diffMin < 0){ cls = " late"; label = "te laat"; }
      else if(diffMin <= 60){ cls = " soon"; label = "binnen " + diffMin + " min"; }
      return `<span class="zd-t-time${cls}">${label}</span>`;
    }

    function renderCategories(){
      const now = new Date();
      const groups = {};
      Object.keys(CAT_TARGETS).forEach(c => groups[c] = []);
      (state.periodicTasks || []).forEach(x=>{
        const c = CAT_TARGETS[x.category] ? x.category : "Keuken"; // zonder categorie -> Keuken
        groups[c].push(x);
      });
      Object.keys(CAT_TARGETS).forEach(cat=>{
        const wrap = document.getElementById(CAT_TARGETS[cat]);
        if(!wrap) return;
        const items = groups[cat];
        if(!items.length){
          wrap.innerHTML = `<div class="zd-cat-empty">Geen taken vandaag</div>`;
          return;
        }
        // Taken met tijd eerst (deadline bovenaan)
        items.sort((a,b)=>{
          const at = (!a.all_day && a.start_time) ? a.start_time : "99:99";
          const bt = (!b.all_day && b.start_time) ? b.start_time : "99:99";
          return at.localeCompare(bt);
        });
        wrap.innerHTML = items.map(x=>`
          <div class="zd-t">
            <span class="zd-t-dot"></span>
            <div class="zd-t-text">${x.title}</div>
            ${taskTimeBadge(x, now)}
          </div>
        `).join("");
      });
    }

    function renderAll(){
      renderHeader();
      renderChecklists();
      renderCategories();
    }

    async function toggleFS(){
      try{
        if(document.fullscreenElement){
          await document.exitFullscreen();
        }else{
          const el = document.getElementById('dashboard-shell');
          if(el.requestFullscreen) await el.requestFullscreen();
          else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        }
      }catch(_){}
    }

    document.addEventListener('keydown', (e)=>{
      if((e.key||'').toLowerCase()==='f') toggleFS();
    });

    renderHeader();
    loadAll();
    setInterval(renderHeader, 1000);
    setInterval(loadAll, CONFIG.refreshMs);
  })();
  </script>
</body>
</html>
